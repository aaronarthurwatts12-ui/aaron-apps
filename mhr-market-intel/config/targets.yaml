# MHR Market Intelligence — target configuration
#
# This file drives the weekly digest (see .claude/skills/mhr-digest/SKILL.md).
# Everything marked "TODO" or "EXAMPLE" below is a placeholder — replace it
# with your real lists. Nothing else needs to change; the skill reads
# straight from this file.

company:
  name: "MHR"
  product: "iTrent (HR & Payroll SaaS)"

# The four public-sector verticals in scope, per your brief. "Government"
# is local-government priority, but central government/civil service can
# stay in scope at lower weight — flag if you want it dropped entirely.
sectors:
  - name: "Education"
    notes: "Universities, colleges, multi-academy trusts (MATs)"
  - name: "Government"
    notes: "Local government is priority; central gov/civil service secondary"
  - name: "Non-profit"
    notes: "Charities, housing associations, membership bodies"
  - name: "Emergency Services"
    notes: "Police, fire & rescue, ambulance trusts"

