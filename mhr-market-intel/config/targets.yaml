# MHR Market Intelligence — target configuration
#
# This file drives the weekly digest (see .claude/skills/mhr-digest/SKILL.md).
# Sourced from Aaron's competitor/industry/job-role spreadsheet plus a real
# CRM export of target accounts with renewal dates.

company:
  name: "MHR"
  product: "iTrent (HR & Payroll SaaS)"

# Sectors as they actually appear in the CRM's Industry field (from
# target_accounts.csv), not the original 4-vertical brief — real data
# split "Central government" out from "Local government" as its own
# category, and surfaced two categories not in the original brief:
# Healthcare and Housing Associations. Flag if either should be dropped
# rather than tracked; left in for now since real target accounts exist
# in both.
sectors:
  - name: "Education"
    sub_segments:
      - "Higher education"
      - "Multi-academy trusts"
      - "Further education (colleges)"
      - "Independent schools"
  - name: "Local Government"
  - name: "Central Government"
  - name: "Emergency Services & Military"
  - name: "Charity"
    notes: "Non-profit — CRM field value is 'Charity'"
  - name: "Housing Associations"
    notes: "Not in original brief — confirm in/out of scope"
  - name: "Healthcare"
    notes: "Not in original brief — confirm in/out of scope"

# Ideal customer profile — used to widen People Moves and New Job
# Openings beyond the named target_accounts_source list. Any organisation
# in one of the sectors above with at least this many employees is in
# scope for those two sections, whether or not it appears in
# target_accounts.csv; the named list stays the source for
# renewal-timing/"flag to sales" actions specifically, since that needs a
# real contract_end_date, not just an ICP fit.
icp:
  min_employees: 100
  sectors: "same as sectors above"

