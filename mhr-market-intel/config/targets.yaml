# MHR Market Intelligence — target configuration
#
# This file drives the weekly digest (see .claude/skills/mhr-digest/SKILL.md).
# Sourced from Aaron's competitor/industry/job-role spreadsheet. Still
# outstanding: named target accounts (TODO below) — without these, people
# moves and account-level signals stay generic rather than targeted.

company:
  name: "MHR"
  product: "iTrent (HR & Payroll SaaS)"

# Core sectors and their sub-segments, as supplied. "Local government"
# includes central government/the four home nations' authorities as a
# secondary sub-segment — flag if that split isn't what you intended.
sectors:
  - name: "Education"
    sub_segments:
      - "Higher education"
      - "Multi-academy trusts"
      - "Further education (colleges)"
      - "Independent schools"
  - name: "Local government"
    sub_segments:
      - "Central government"
      - "English / Scottish / NI / Welsh authorities"
  - name: "Emergency services"
    sub_segments:
      - "Ambulance"
      - "Police"
      - "Military"
      - "Fire department"
  - name: "Non-profit"
    sub_segments:
      - "Charities"
      - "Religious institutions"
      - "Associations and memberships"

competitors:
  - name: "Zellis"
    website: "https://www.zellis.com"
    blog_rss: null # fill in if/when a feed is found
  - name: "Unit4"
    website: "https://www.unit4.com"
    blog_rss: null
  - name: "Access Group (OneAdvanced)"
    website: "https://www.theaccessgroup.com"
    blog_rss: null
  - name: "TechnologyOne (TechOne)"
    website: "https://www.technologyonecorp.com"
    blog_rss: null
  - name: "SAP"
    website: "https://www.sap.com/products/hcm.html"
    blog_rss: null
    tier: "larger ERP — track at lower frequency unless public-sector-specific"
  - name: "Oracle"
    website: "https://www.oracle.com/uk/human-capital-management/"
    blog_rss: null
    tier: "larger ERP — track at lower frequency unless public-sector-specific"

# TODO (Aaron): populate with real named accounts, e.g.
#   - name: "Birmingham City Council"
#     sector: "Local government"
#     priority: "high"
target_accounts:
  - name: "EXAMPLE — replace with real target accounts"
    sector: "Local government"
    priority: "medium"

# Roles to watch for: (a) role changes / new appointments at target
# accounts, and (b) new job openings signalling a transformation
# programme, HRIS/payroll procurement, or budget for change.
job_titles:
  - "HR Director"
  - "Head of Digital Transformation"
  - "Head of Payroll"
  - "Chief Information Officer"
  - "Head of People"
  - "Chief Technology Officer"
  # Broad catch-all per Aaron's brief — any transformation-flavoured title,
  # not just the ones listed above (e.g. "Head of Transformation",
  # "Director of Digital & Change", "Transformation Programme Lead").
  - "* Digital Transformation (any title)"

# Used to keep "industry news" relevant instead of generic HR-tech noise.
keywords:
  include:
    - "HR transformation"
    - "payroll transformation"
    - "shared services"
    - "workforce planning"
    - "public sector digital transformation"
    - "HR system procurement"
    - "ERP replacement"
    - "self-service HR"
  exclude:
    - "recruitment agency"
    - "staffing agency"

# Legislation & regulatory changes affecting HR/payroll practice in the
# public sector. Tracked and flagged weekly as their own digest section —
# separate from general "industry news" because these are compliance-driving,
# not just directional.
legislation:
  topics:
    - "National Minimum/Living Wage rate changes"
    - "Employment Rights Bill / UK employment law reform"
    - "IR35 / off-payroll working rules"
    - "Pensions auto-enrolment threshold and contribution changes"
    - "Public sector pay awards (NHS Agenda for Change, Local Government/NJC, Teachers' Pay, Police/Fire pay review bodies, Armed Forces Pay Review Body)"
    - "Statutory sick pay, family leave and flexible working law changes"
    - "Right to work / immigration compliance changes affecting payroll"
    - "HMRC payroll reporting changes (RTI, tax codes, thresholds)"
    - "Procurement Act 2023 and public sector software procurement rules"
  sources:
    - "legislation.gov.uk"
    - "gov.uk (HMRC, DLUHC/MHCLG, DfE, Home Office, Cabinet Office)"
    - "ACAS"
    - "CIPD"
    - "Local Government Association (LGA) pay circulars / NJC"
    - "NHS Employers"

# Content strategy inputs — used to map competitor/industry content against
# what MHR has actually published, surface gaps, and suggest topics.
content_strategy:
  # TODO (Aaron): list MHR's existing content hubs/feeds so gap analysis can
  # check what's already been published rather than assuming a gap exists.
  mhr_content_sources:
    - "EXAMPLE — e.g. https://www.mhrglobal.com/uk/en/resources/blog"
  # Topic clusters content gets mapped against — one per sector plus a few
  # cross-cutting themes. Extend as real topics emerge from digests.
  topic_clusters:
    - "Education: MAT growth & HR/payroll consolidation"
    - "Local government: reorganisation (LGR) & shared services"
    - "Emergency services: workforce scheduling & wellbeing"
    - "Non-profit: lean HR teams & compliance at scale"
    - "Cross-sector: AI in public sector HR/payroll"
    - "Cross-sector: pay & reward compliance"

delivery:
  cadence: "weekly"
  format: "artifact" # "artifact" (styled report) or "markdown" (plain file in reports/)
