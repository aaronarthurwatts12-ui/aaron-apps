# Real target accounts with known renewal dates — the primary driver of
# account-specific "flag to sales" actions. 315 accounts across all 7
# sectors above, with real Industry, Employees, current HR/Payroll
# product+supplier, and renewal dates from the CRM. This list is a floor,
# not a ceiling (per Aaron's brief): competitor/legislation/industry
# findings are still relevant to a sector even when no specific account
# here is named in the source.
#
# Columns: employee_count_band and contract_end_date/start_engagement_by
# are pre-computed (see sales_cycle_timing below) — contract_end_date is
# the earliest FUTURE date among the three renewal-date columns;
# has_past_renewal_date_on_file flags rows where at least one renewal
# date on file is already in the past (could be stale data, or a
# multi-year product with an earlier component already renewed —
# unconfirmed, treat as informational not actionable on its own).
target_accounts_source: "config/target_accounts.csv"

# Broader, education-only prospect list (1,576 accounts) from an earlier,
# less-targeted CRM export. Same schema as target_accounts.csv but sparse
# renewal-date coverage (~4%) and a heuristic sector_guess rather than a
# real CRM Industry value. Useful as a wider top-of-funnel pool for
# Education-sector content/people-moves targeting, but NOT the source for
# account-specific renewal-timing actions — target_accounts.csv is.
target_accounts_extended_source: "config/target_accounts_education_prospects.csv"

# Roles to watch for: (a) role changes / new appointments at target
# accounts, and (b) new job openings signalling a transformation
# programme, HRIS/payroll procurement, or budget for change.
job_titles:
  - "HR Director"
  - "Head of Digital Transformation"
  - "Head of Payroll"
  - "Chief Information Officer"
  - "Head of People"
  - "Chief Technology Officer"
  # Broad catch-all per Aaron's brief — any transformation-flavoured title,
  # not just the ones listed above (e.g. "Head of Transformation",
  # "Director of Digital & Change", "Transformation Programme Lead").
  - "* Digital Transformation (any title)"

# Used to keep "industry news" relevant instead of generic HR-tech noise.
keywords:
  include:
    - "HR transformation"
    - "payroll transformation"
    - "shared services"
    - "workforce planning"
    - "public sector digital transformation"
    - "HR system procurement"
    - "ERP replacement"
    - "self-service HR"
  exclude:
    - "recruitment agency"
    - "staffing agency"

# Legislation & regulatory changes affecting HR/payroll practice in the
# public sector. Tracked and flagged weekly as their own digest section —
# separate from general "industry news" because these are compliance-driving,
# not just directional.
legislation:
  topics:
    - "National Minimum/Living Wage rate changes"
    - "Employment Rights Bill / UK employment law reform"
    - "IR35 / off-payroll working rules"
    - "Pensions auto-enrolment threshold and contribution changes"
    - "Public sector pay awards (NHS Agenda for Change, Local Government/NJC, Teachers' Pay, Police/Fire pay review bodies, Armed Forces Pay Review Body)"
    - "Statutory sick pay, family leave and flexible working law changes"
    - "Right to work / immigration compliance changes affecting payroll"
    - "HMRC payroll reporting changes (RTI, tax codes, thresholds)"
    - "Procurement Act 2023 and public sector software procurement rules"
  sources:
    - "legislation.gov.uk"
    - "gov.uk (HMRC, DLUHC/MHCLG, DfE, Home Office, Cabinet Office)"
    - "ACAS"
    - "CIPD"
    - "Local Government Association (LGA) pay circulars / NJC"
    - "NHS Employers"

# Content strategy inputs — used to map competitor/industry content against
# what MHR has actually published, surface gaps, and suggest topics.
content_strategy:
  # TODO (Aaron): list MHR's existing content hubs/feeds so gap analysis can
  # check what's already been published rather than assuming a gap exists.
  mhr_content_sources:
    - "EXAMPLE — e.g. https://www.mhrglobal.com/uk/en/resources/blog"
  # Topic clusters content gets mapped against — one per sector plus a few
  # cross-cutting themes. Extend as real topics emerge from digests.
  topic_clusters:
    - "Education: MAT growth & HR/payroll consolidation"
    - "Local government: reorganisation (LGR) & shared services"
    - "Emergency services: workforce scheduling & wellbeing"
    - "Non-profit: lean HR teams & compliance at scale"
    - "Cross-sector: AI in public sector HR/payroll"
    - "Cross-sector: pay & reward compliance"

# Turns "contract ends in N months" into "start engagement by" — per
# Aaron's brief on typical sales-cycle length by org size. Only computable
# once an account in target_accounts.csv has both contract_end_date and
# employee_count_band filled in; until then the digest should flag the
# account as a renewal candidate without a computed engagement-start date.
sales_cycle_timing:
  bands:
    - employee_count: "100-400"
      typical_sales_cycle_months: "3-6"
    - employee_count: "400-1000"
      typical_sales_cycle_months: "6-12"
    - employee_count: "1000+"
      typical_sales_cycle_months: "12-24"
      notes: "sometimes longer"
  rule: >
    start_engagement_by = contract_end_date minus the upper end of the
    typical_sales_cycle_months for that account's employee_count_band
    (i.e. plan for the longer end of the range, not the shorter one).

delivery:
  cadence: "weekly"
  formats: ["artifact", "email"] # any of: "artifact" (styled report), "markdown" (plain file in reports/), "email"
  email:
    recipient: "aaron.watts@mhr.co.uk"
    subject_template: "Public Sector Weekly Digest {date}" # {date} = the digest's run date, e.g. "2 September 2026"
    send_via: "Gmail connector (mcp__Gmail__send_message)"
    template: "mhr-market-intel/templates/email_template.html"
    brand: "mhr-market-intel/config/brand.yaml"
