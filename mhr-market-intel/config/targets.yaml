# TODO (Aaron): populate with real named accounts, e.g.
#   - name: "Birmingham City Council"
#     sector: "Government"
#     priority: "high"
target_accounts:
  - name: "EXAMPLE — replace with real target accounts"
    sector: "Government"
    priority: "medium"

# Roles to watch for: (a) role changes / new appointments at target
# accounts, and (b) new job openings signalling a transformation
# programme, HRIS/payroll procurement, or budget for change.
job_titles:
  - "HR Director"
  - "Director of People"
  - "Chief People Officer"
  - "Head of HR Transformation"
  - "Head of People Services"
  - "Senior Transformation Lead"
  - "Head of Organisational Development"
  - "Head of Payroll"

# Used to keep "industry news" relevant instead of generic HR-tech noise.
keywords:
  include:
    - "HR transformation"
    - "payroll transformation"
    - "shared services"
    - "workforce planning"
    - "public sector digital transformation"
    - "HR system procurement"
    - "ERP replacement"
    - "self-service HR"
  exclude:
    - "recruitment agency"
    - "staffing agency"

delivery:
  cadence: "weekly"
  format: "artifact" # "artifact" (styled report) or "markdown" (plain file in reports/)
